<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Export - BugTracker AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-bug"></i> BugTracker AI
            </div>
            <ul class="nav-links">
                <li><a href="{{ url_for('admin_dashboard') }}"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                <li><a href="{{ url_for('admin_users') }}"><i class="fas fa-users-cog"></i> User Management</a></li>
                <li><a href="{{ url_for('admin_bugs') }}"><i class="fas fa-tasks"></i> Bug Reports</a></li>
                <li><a href="{{ url_for('admin_reports') }}" class="active"><i class="fas fa-file-export"></i> Reports &
                        Export</a></li>
                <li><a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-wrapper">
                <header class="top-bar">
                    <h2>Reports & Export</h2>
                    <div class="user-profile">
                        <span>Admin</span>
                        <div class="user-avatar">AD</div>
                    </div>
                </header>

                <div class="stats-grid">
                    <a href="{{ url_for('export_csv') }}" class="stat-card"
                        style="cursor: pointer; text-decoration: none;">
                        <div class="stat-icon"><i class="fas fa-file-csv"></i></div>
                        <div class="stat-info">
                            <h3>CSV Export</h3>
                            <p>Download all bug data</p>
                        </div>
                    </a>
                    <div class="stat-card" style="cursor: pointer;">
                        <div class="stat-icon" style="color: #ef4444;"><i class="fas fa-file-pdf"></i></div>
                        <div class="stat-info">
                            <h3>PDF Report</h3>
                            <p>Download monthly summary</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
